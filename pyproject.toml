[project]
name = "tally"
version = "0.1.0"
description = "An airlock for supplier invoices: every file is opened in a throwaway sandbox, its hidden text exposed, its numbers checked by code, and nothing is paid until a person approves."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "N DIVIJ" }]
requires-python = ">=3.11"
# PDF handling is pypdfium2 (Apache-2.0 / BSD) and pypdf (BSD), so the whole project stays MIT-compatible.
dependencies = [
  "pypdfium2>=4.30",
  # pypdf 7 removed add_js, which the test invoices use; the airlock's active-content checks are tested on 5 and 6.
  "pypdf>=5.0,<7",
  "pillow>=10.0",
  # The web app (Flask, BSD-3-Clause) and the server it runs under on the host (gunicorn, MIT).
  "flask>=3.0",
  "gunicorn>=22.0",
]

[project.optional-dependencies]
# reportlab only builds the test invoices, including the attack ones.
dev = ["pytest>=8.0", "reportlab>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tally*"]

[tool.setuptools.package-data]
"tally.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
