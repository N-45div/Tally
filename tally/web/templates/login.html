{% extends "base.html" %}
{% import "_icons.html" as icon %}
{% set layout = "narrow" %}
{% block title %}Sign in{% endblock %}
{% block main %}
<section class="card auth-card" aria-labelledby="signin-title">
  <div class="auth-icon">{{ icon.lock("icon icon-lg") }}</div>
  <h1 id="signin-title">Sign in</h1>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Name <input name="name" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary btn-lg">Sign in</button>
  </form>
</section>
<p class="auth-after">How Tally is attacked on every release, and what happened: <a href="{{ url_for('lab') }}">the lab</a>.</p>
{% endblock %}
