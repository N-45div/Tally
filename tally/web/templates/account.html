{% extends "base.html" %}
{% import "_icons.html" as icon %}
{% set layout = "narrow" %}
{% block title %}Your password{% endblock %}
{% block main %}
<section class="card auth-card" aria-labelledby="account-title">
  <div class="auth-icon">{{ icon.lock("icon icon-lg") }}</div>
  <h1 id="account-title">Change your password</h1>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
    <label>New password (at least 12 characters) <input name="new" type="password" autocomplete="new-password" minlength="12" required></label>
    <label>New password again <input name="again" type="password" autocomplete="new-password" minlength="12" required></label>
    <button class="btn btn-primary btn-lg">Change password</button>
  </form>
</section>
{% endblock %}
