{% extends "base.html" %}
{% block title %}Your password{% endblock %}
{% block main %}
<section class="narrow">
  <h1>Change your password</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
    <label>New password (at least 12 characters) <input name="new" type="password" autocomplete="new-password" minlength="12" required></label>
    <label>New password again <input name="again" type="password" autocomplete="new-password" minlength="12" required></label>
    <button>Change password</button>
  </form>
</section>
{% endblock %}
