; Tally's desk device: an ESP32-S3 board with a microphone, a speaker, a small screen and one button.
;   pio run                 build
;   pio run -t upload       flash over USB (keeps the Wi-Fi network saved on the board)
;   pio device monitor      the serial console at 115200
; Then set the server and the device's token with: py provision.py (see README.md).

[env:desk]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
; 16 MB flash (QIO) and 8 MB PSRAM (octal)
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTALLY_FIRMWARE=\"tally-desk/0.1.2\"
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.12.6
    bblanchon/ArduinoJson@7.4.3
